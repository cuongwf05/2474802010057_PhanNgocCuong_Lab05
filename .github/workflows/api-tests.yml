name: ReqRes API tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Newman and HTML reporter
        run: npm install --global newman newman-reporter-htmlextra
      - name: Run data-driven collection
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: >-
          newman run ReqRes_Collection.json -e ReqRes_Environment.json -d users.csv
          --env-var "api_key=$REQRES_API_KEY"
          --reporters cli,htmlextra --reporter-htmlextra-export report.html
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reqres-api-report
          path: report.html
          if-no-files-found: warn
